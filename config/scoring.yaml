# How Tree-of-Thought scores a branch (T4.3), read by tot/scoring.py.
#
# The rubric and the 0.30 threshold are the ToT design's initial estimates, to be tuned on the
# labeled benchmark. Everything marked "chosen by hand" has no measurement behind it yet.

# Below this a branch is pruned. The design's value, an initial estimate.
threshold: 0.30

# The full rubric at depth 2, where passages have been retrieved. The design's weights. When
# numerical consistency is not applicable it is removed and the others are rescaled (gap 1).
rubric:
  evidence_support: 0.40
  numerical_consistency: 0.30
  no_contradiction: 0.20
  specificity: 0.10

# The pre-screen at depth 1, where nothing has been retrieved yet, so only the two criteria that
# need no retrieval count. The design's rescaling: 0.30 and 0.10 become 0.75 and 0.25.
prescreen:
  evidence_support: 0.0
  numerical_consistency: 0.75
  no_contradiction: 0.0
  specificity: 0.25

# What each level the critic can choose is worth. The critic picks a level with a written meaning,
# not a number, so the scores stay comparable across calls and can be retuned without new calls.
evidence_support:
  # The rubric's top case: a passage directly states the cause.
  states_cause: 1.0
  # The rubric also credits "clearly implies", but less than a statement. Chosen by hand.
  implies: 0.7
  # Fits the claim without bearing on its cause: what a plausible label rests on. Chosen by hand.
  consistent: 0.4
  none: 0.0

no_contradiction:
  none: 1.0
  # Halfway, because the conflict is unclear. Chosen by hand.
  possible: 0.5
  direct: 0.0

specificity:
  specific: 1.0
  # Halfway, so a partly testable text-only claim clears the threshold at depth 1, where this
  # criterion is all it has. The pre-screen should only remove clearly unsupported candidates.
  # Chosen by hand.
  partial: 0.5
  vague: 0.0

# The beam and its tie rule (T4.4), read by tot/controller.py. All are the ToT design's initial
# estimates, to be tuned on the labeled benchmark (it plans to widen the beam if too few known
# causes survive).
beam:
  # Candidates proposed at depth 1. The design says 6 to 8 and keeps 4; the low end leaves node
  # budget for the retries and the one fresh round (gap 5).
  candidates: 6
  # Candidates that go on to depth 2. The design's width.
  candidate_width: 4
  # Evidence sources proposed for each kept candidate. The design says 6 to 8; the low end again.
  sources: 6
  # Evidence branches kept per candidate. The design's width.
  evidence_width: 3
  # Two branches within this score gap at the beam cutoff are tied, and the tie rule decides. The
  # design's value.
  tie_margin: 0.05

# Node evaluations per finding. Counted as evaluated nodes, not retrieve calls: a reformulated
# search can make up to five of those for one evaluation.
budget:
  # The design says about 40. The first round's own use is at most 30 (6 candidates plus 4 kept
  # times 6 sources), which leaves 10 for retries.
  first_round_nodes: 40
  # The one fresh round gets its own allowance (the user's decision, 2026-11-06), so a first round
  # that used its 40 cannot leave the second too few to test anything. It differs from the design,
  # which has one budget of about 40 for the finding. The worst case is 70 and an ordinary finding
  # still costs what it did. 30 is the first round's own use. Chosen by hand.
  fresh_round_nodes: 30
